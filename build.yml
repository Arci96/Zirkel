name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Bauen
        run: mvn -B clean package

      - name: Jar als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Zirkel
          path: target/Zirkel.jar

      - name: Release erstellen (nur bei Tags wie v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/Zirkel.jar
